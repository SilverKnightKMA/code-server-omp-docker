name: Update pi-config Pack Pin

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    # Hourly at :23 — the pi-config pack tags multiple times per dev day and
    # the weekly managed-tools sweep is too slow to track it.
    - cron: "23 * * * *"
    # Second slot at :53 — GitHub drops/delays low-priority scheduled runs
    # under load (observed ~1 run per 5h with one slot); two slots double the
    # chance at least one fires each hour. Merged PRs re-trigger via
    # workflow_run, so no double-PR risk: the updater no-ops when the pin is
    # already current.
    - cron: "53 * * * *"
  workflow_dispatch:
  # Fallback: GitHub drops cron during peak load (observed misses at 10:23,
  # 11:23, 12:23 today). When the bump PR merges, auto-merge-pr runs, and
  # its completion re-triggers this workflow — a new tag opens the next PR;
  # with no new tag create-pull-request creates nothing and the chain stops.
  workflow_run:
    workflows: ["Auto Merge Automation PRs"]
    types: [completed]
    branches: [automated/update-pi-config-pin]

concurrency:
  group: update-pi-config-pin
  cancel-in-progress: false

jobs:
  update-pi-config-pin:
    name: Bump silverknight pi-extension pack pin to the latest pi-config tag
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout builder repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update pi-config pack pin
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npm run update:pi-config-pin

      - name: Validate managed tool manifest
        run: npm run validate:managed-tools

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: bump silverknight-pi-extensions pin to latest pi-config tag"
          title: "chore: bump silverknight-pi-extensions pin to latest pi-config tag"
          body: |
            Bumps `silverknight-pi-extensions` (sourceType github, repo
            SilverKnightKMA/pi-config) to the newest `v*` git tag so
            managed-tools delivers it on the next update.

            Auto-generated by the hourly `update-pi-config-pin` workflow.
          branch: automated/update-pi-config-pin
          delete-branch: true
          add-paths: |
            managed-tools/manifest.json
          labels: |
            automated
            dependencies
